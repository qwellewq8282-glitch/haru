<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하루결</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하루결">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1c1a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow paper column like a pocket notebook; tab bar at the bottom like a phone app */
:root {
  --paper: #f3f1ec;
  --sheet: #fbfaf7;
  --ink: #3b3936;
  --mute: #8f8a82;
  --rule: #dcd8d0;
  --accent: #8a3a34;
  --soft: #e9e5dd;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1d1c1a; --sheet: #252421; --ink: #e6e2da; --mute: #8f8a82; --rule: #3a3834; --accent: #d08a80; --soft: #2f2d2a; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1d1c1a; --sheet: #252421; --ink: #e6e2da; --mute: #8f8a82; --rule: #3a3834; --accent: #d08a80; --soft: #2f2d2a; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 400; font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
.app { max-width: 520px; margin: 0 auto; padding-block: 28px 110px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 14px; border-bottom: 1px solid var(--ink); }
.brand { font-size: 13px; letter-spacing: .18em; font-weight: 500; }
.today { font-family: var(--mono); font-size: 12px; color: var(--mute); }
.note { font-size: 11px; color: var(--mute); margin: 8px 0 0; }

.view-title { display: flex; justify-content: space-between; align-items: baseline; margin: 30px 0 6px; }
.view-title h1 { font-size: 22px; font-weight: 300; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.date-nav { display: flex; gap: 2px; align-items: center; font-family: var(--mono); font-size: 13px; color: var(--mute); }
.date-nav button { background: none; border: 0; padding: 4px 8px; color: var(--mute); }
.date-nav button:hover { color: var(--ink); }

section.block { margin-top: 26px; }
.label { font-size: 11px; letter-spacing: .14em; color: var(--mute); font-weight: 500; display: flex; justify-content: space-between; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.label span:last-child { font-family: var(--mono); letter-spacing: 0; }

ul.list { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--rule); min-width: 0; }
.row .t { font-family: var(--mono); font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; }
.row .x { min-width: 0; overflow-wrap: anywhere; }
.del { background: none; border: 0; color: var(--mute); font-size: 13px; padding: 2px 6px; opacity: .55; }
.del:hover { opacity: 1; color: var(--accent); }

.todo { grid-template-columns: 22px 1fr auto; }
.check { width: 16px; height: 16px; border: 1px solid var(--ink); background: none; padding: 0; border-radius: 50%; display: grid; place-items: center; }
.check.on { background: var(--ink); }
.check.on::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--sheet); }
.todo.done .x { color: var(--mute); text-decoration: line-through; text-decoration-color: var(--mute); }

.adder { display: flex; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.adder input, .adder select { background: transparent; border: 0; border-bottom: 1px dashed transparent; padding: 4px 0; min-width: 0; }
.adder input:focus, .adder select:focus { outline: none; border-bottom-color: var(--mute); }
.adder input::placeholder { color: var(--mute); }
.adder .grow { flex: 1; }
.adder input[type="time"] { width: 96px; font-family: var(--mono); font-size: 13px; }
.add-btn { background: none; border: 1px solid var(--ink); padding: 2px 12px; font-size: 13px; border-radius: 999px; white-space: nowrap; }
.add-btn:hover { background: var(--ink); color: var(--paper); }
.empty { color: var(--mute); font-size: 13px; padding: 12px 0; border-bottom: 1px solid var(--rule); }

.progress { height: 2px; background: var(--rule); margin-top: 10px; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }

/* week */
.week { display: grid; gap: 0; }
.day { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.day:hover { background: var(--soft); }
.day .d { font-family: var(--mono); font-size: 13px; }
.day .d b { display: block; font-family: var(--sans); font-weight: 400; font-size: 11px; color: var(--mute); }
.day.is-today .d { color: var(--accent); }
.day .items { min-width: 0; font-size: 13px; }
.day .items div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day .items .m { color: var(--mute); }
.dots { display: flex; gap: 3px; margin-top: 4px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; border: 1px solid var(--ink); }
.dots i.f { background: var(--ink); }

/* research log */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.chip { background: none; border: 1px solid var(--rule); padding: 3px 12px; border-radius: 999px; font-size: 12px; color: var(--mute); }
.chip.on { border-color: var(--ink); color: var(--ink); }
.log { padding: 16px 0; border-bottom: 1px solid var(--rule); }
.log .meta { display: flex; gap: 10px; align-items: baseline; font-size: 11px; color: var(--mute); }
.log .meta .dt { font-family: var(--mono); }
.log .meta .pj { color: var(--accent); letter-spacing: .06em; }
.log .meta .del { margin-left: auto; }
.log p { margin: 6px 0 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.log-form { display: grid; gap: 8px; padding: 14px; background: var(--sheet); border: 1px solid var(--rule); margin-top: 14px; }
.log-form textarea { font: inherit; color: inherit; background: transparent; border: 0; resize: vertical; min-height: 70px; padding: 0; }
.log-form textarea:focus { outline: none; }
.log-form textarea::placeholder { color: var(--mute); }
.log-form .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.log-form select { background: transparent; border: 0; font-size: 13px; color: var(--accent); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--sheet); border-top: 1px solid var(--rule);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
nav.tabs button { background: none; border: 0; padding: 14px 0 16px; font-size: 13px; color: var(--mute); position: relative; }
nav.tabs button.on { color: var(--ink); }
nav.tabs button.on::before { content: ""; position: absolute; top: -1px; left: 30%; right: 30%; height: 1px; background: var(--ink); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

html { -webkit-text-size-adjust: 100%; }
body { margin: 0; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
.app { padding-top: calc(env(safe-area-inset-top, 0px) + 20px); }
input, select, textarea { font-size: 16px !important; } /* iOS zooms in on smaller inputs */
.tools { background: none; border: 0; font-size: 12px; color: var(--mute); padding: 4px 0 4px 10px; }
.backup { margin-top: 14px; padding: 14px; background: var(--sheet); border: 1px solid var(--rule); display: grid; gap: 10px; font-size: 13px; }
.backup p { margin: 0; color: var(--mute); }
.backup .bar { display: flex; gap: 8px; flex-wrap: wrap; }
.backup label.add-btn { display: inline-block; cursor: pointer; }
.backup input[type=file] { display: none; }
.msg { color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand">하루결</span>
    <span><span class="today" id="todayLbl"></span><button class="tools" id="toolsBtn" aria-expanded="false">백업</button></span>
  </header>
  <p class="note" id="sampleNote">예시 기록이 들어 있어요. 지우고 내 기록으로 채워보세요. 기록은 이 휴대폰에만 저장돼요.</p>
  <div class="backup" id="backup" hidden>
    <p>기록은 이 휴대폰에만 저장돼요. 가끔 백업 파일을 내려받아 두면 휴대폰을 바꿔도 옮길 수 있어요.</p>
    <div class="bar">
      <button class="add-btn" id="exportBtn">백업 파일 저장</button>
      <label class="add-btn" for="importFile">백업 불러오기</label>
      <input type="file" id="importFile" accept="application/json,.json">
    </div>
    <p class="msg" id="backupMsg" hidden></p>
  </div>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="화면">
  <div class="in">
    <button data-tab="day" id="tab-day">오늘</button>
    <button data-tab="week" id="tab-week">이번 주</button>
    <button data-tab="log" id="tab-log">연구 기록</button>
  </div>
</nav>

<script>
const KEY = "harugyeol.v1";
const DOW = ["일","월","화","수","목","금","토"];
const PROJECTS = ["ADNI QC","Q-MR","석사 지원","수업","기타"];
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (s,n) => { const d = new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d); };
const fmt = s => { const d = new Date(s+"T00:00:00"); return `${d.getMonth()+1}.${pad(d.getDate())} ${DOW[d.getDay()]}`; };
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TODAY = iso(new Date());

function sample() {
  const t = TODAY, y = addDays(t,-1), y2 = addDays(t,-2);
  return {
    sample: true,
    events: [
      {id:uid(), date:t, time:"10:00", title:"랩미팅"},
      {id:uid(), date:t, time:"14:00", title:"수리통계2 수업"},
      {id:uid(), date:addDays(t,1), time:"11:00", title:"교수님 면담"},
      {id:uid(), date:addDays(t,3), time:"16:00", title:"논문 스터디"}
    ],
    todos: [
      {id:uid(), date:t, text:"QC 결과 표 정리해서 공유", done:true},
      {id:uid(), date:t, text:"연구계획서 목차 잡기", done:false},
      {id:uid(), date:t, text:"MR 논문 방법 섹션 읽기", done:false},
      {id:uid(), date:addDays(t,1), text:"면담 질문 3개 적기", done:false}
    ],
    logs: [
      {id:uid(), date:t, project:"ADNI QC", text:"call rate 기준 0.98로 다시 필터링. 제거된 샘플 수가 예상보다 많아서 원인 확인 필요."},
      {id:uid(), date:y, project:"Q-MR", text:"doubly-ranked 방법 초록 읽음. 계층을 나누는 방식이 핵심인 듯. KoGES에 적용 가능한지 데이터 변수부터 확인하기."},
      {id:uid(), date:y2, project:"석사 지원", text:"연구계획서에 넣을 키워드: 유전체 QC 경험, MR, 한국 코호트."}
    ]
  };
}

let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
if (!state || !state.events) state = sample();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const clearSample = () => { if (state.sample) { state.sample = false; } };

let tab = "day", cur = TODAY, filter = "전체";
try { tab = localStorage.getItem(KEY+".tab") || "day"; } catch (e) {}

const view = document.getElementById("view");
document.getElementById("todayLbl").textContent = fmt(TODAY);

function render() {
  document.getElementById("sampleNote").hidden = !state.sample;
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (tab === "day") renderDay(); else if (tab === "week") renderWeek(); else renderLog();
}

function renderDay() {
  const ev = state.events.filter(e => e.date === cur).sort((a,b) => a.time.localeCompare(b.time));
  const td = state.todos.filter(t => t.date === cur);
  const done = td.filter(t => t.done).length;
  const logs = state.logs.filter(l => l.date === cur);
  view.innerHTML = `
    <div class="view-title">
      <h1>${cur === TODAY ? "오늘" : fmt(cur)}</h1>
      <div class="date-nav">
        <button data-nav="-1" aria-label="전날">←</button>
        <span>${fmt(cur)}</span>
        <button data-nav="1" aria-label="다음날">→</button>
      </div>
    </div>
    <section class="block">
      <div class="label"><span>일정</span><span>${ev.length}</span></div>
      <ul class="list">${ev.map(e => `<li class="row"><span class="t">${e.time||"--:--"}</span><span class="x">${esc(e.title)}</span><button class="del" data-del-ev="${e.id}" aria-label="일정 삭제">×</button></li>`).join("") || `<li class="empty">일정이 없어요.</li>`}</ul>
      <form class="adder" id="evForm">
        <input type="time" id="evTime" value="09:00" aria-label="시간">
        <input class="grow" id="evTitle" placeholder="일정 추가" enterkeyhint="done" aria-label="일정 내용">
        <button class="add-btn">추가</button>
      </form>
    </section>
    <section class="block">
      <div class="label"><span>할 일</span><span>${done}/${td.length}</span></div>
      <div class="progress"><i style="width:${td.length ? done/td.length*100 : 0}%"></i></div>
      <ul class="list">${td.map(t => `<li class="row todo ${t.done?"done":""}"><button class="check ${t.done?"on":""}" data-tg="${t.id}" aria-label="완료 표시"></button><span class="x">${esc(t.text)}</span><button class="del" data-del-td="${t.id}" aria-label="할 일 삭제">×</button></li>`).join("") || `<li class="empty">할 일이 없어요.</li>`}</ul>
      <form class="adder" id="tdForm">
        <input class="grow" id="tdText" placeholder="할 일 추가" enterkeyhint="done" aria-label="할 일 내용">
        <button class="add-btn">추가</button>
      </form>
    </section>
    <section class="block">
      <div class="label"><span>이날의 연구 기록</span><span>${logs.length}</span></div>
      ${logs.map(logHTML).join("") || `<div class="empty">기록이 없어요. 연구 기록 탭에서 남길 수 있어요.</div>`}
    </section>`;
}

function renderWeek() {
  const d = new Date(TODAY+"T00:00:00");
  const mon = addDays(TODAY, -((d.getDay()+6)%7));
  const days = Array.from({length:7}, (_,i) => addDays(mon,i));
  const all = state.todos.filter(t => days.includes(t.date));
  view.innerHTML = `
    <div class="view-title"><h1>이번 주</h1><div class="date-nav"><span>${fmt(days[0])} – ${fmt(days[6])}</span></div></div>
    <section class="block">
      <div class="label"><span>요일별</span><span>할 일 ${all.filter(t=>t.done).length}/${all.length}</span></div>
      <div class="week">${days.map(day => {
        const ev = state.events.filter(e => e.date === day).sort((a,b)=>a.time.localeCompare(b.time));
        const td = state.todos.filter(t => t.date === day);
        const lg = state.logs.filter(l => l.date === day).length;
        const dd = new Date(day+"T00:00:00");
        return `<button class="day ${day===TODAY?"is-today":""}" data-go="${day}">
          <span class="d">${dd.getMonth()+1}.${pad(dd.getDate())}<b>${DOW[dd.getDay()]}요일</b></span>
          <span class="items">${ev.map(e=>`<div>${e.time} ${esc(e.title)}</div>`).join("")}
            ${lg ? `<div class="m">연구 기록 ${lg}</div>` : ""}
            ${!ev.length && !lg && !td.length ? `<div class="m">비어 있음</div>` : ""}
            ${td.length ? `<span class="dots">${td.map(t=>`<i class="${t.done?"f":""}"></i>`).join("")}</span>` : ""}
          </span></button>`; }).join("")}</div>
    </section>`;
}

function logHTML(l) {
  return `<article class="log"><div class="meta"><span class="dt">${fmt(l.date)}</span><span class="pj">${esc(l.project)}</span><button class="del" data-del-lg="${l.id}" aria-label="기록 삭제">×</button></div><p>${esc(l.text)}</p></article>`;
}

function renderLog() {
  const list = state.logs.filter(l => filter === "전체" || l.project === filter).sort((a,b)=>b.date.localeCompare(a.date));
  view.innerHTML = `
    <div class="view-title"><h1>연구 기록</h1><div class="date-nav"><span>${state.logs.length}개</span></div></div>
    <form class="log-form" id="lgForm">
      <textarea id="lgText" placeholder="오늘 한 분석, 읽은 논문, 막힌 점을 짧게 남겨요."></textarea>
      <div class="bar">
        <select id="lgProj" aria-label="프로젝트">${PROJECTS.map(p=>`<option>${p}</option>`).join("")}</select>
        <button class="add-btn">기록</button>
      </div>
    </form>
    <div class="chips">${["전체",...PROJECTS].map(p=>`<button class="chip ${p===filter?"on":""}" data-f="${p}">${p}</button>`).join("")}</div>
    <section class="block">${list.map(logHTML).join("") || `<div class="empty">이 프로젝트에는 아직 기록이 없어요.</div>`}</section>`;
}

view.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const ds = b.dataset;
  if (ds.nav) { cur = addDays(cur, +ds.nav); }
  else if (ds.tg) { const t = state.todos.find(x=>x.id===ds.tg); t.done = !t.done; }
  else if (ds.delEv) { state.events = state.events.filter(x=>x.id!==ds.delEv); clearSample(); }
  else if (ds.delTd) { state.todos = state.todos.filter(x=>x.id!==ds.delTd); clearSample(); }
  else if (ds.delLg) { state.logs = state.logs.filter(x=>x.id!==ds.delLg); clearSample(); }
  else if (ds.go) { cur = ds.go; tab = "day"; }
  else if (ds.f) { filter = ds.f; }
  else return;
  save(); render();
});

view.addEventListener("submit", e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === "evForm") {
    const title = document.getElementById("evTitle").value.trim(); if (!title) return;
    state.events.push({id:uid(), date:cur, time:document.getElementById("evTime").value, title});
  } else if (id === "tdForm") {
    const text = document.getElementById("tdText").value.trim(); if (!text) return;
    state.todos.push({id:uid(), date:cur, text, done:false});
  } else if (id === "lgForm") {
    const text = document.getElementById("lgText").value.trim(); if (!text) return;
    state.logs.push({id:uid(), date:TODAY, project:document.getElementById("lgProj").value, text});
  }
  clearSample(); save(); render();
  const f = document.querySelector(`#${id} input.grow, #${id} textarea`); if (f) f.focus();
});

document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  tab = b.dataset.tab; if (tab === "day") cur = TODAY;
  try { localStorage.setItem(KEY+".tab", tab); } catch (err) {}
  render(); window.scrollTo(0,0);
});

const bk = document.getElementById("backup"), msg = document.getElementById("backupMsg");
const say = t => { msg.textContent = t; msg.hidden = false; };
document.getElementById("toolsBtn").addEventListener("click", e => {
  bk.hidden = !bk.hidden; e.currentTarget.setAttribute("aria-expanded", String(!bk.hidden)); msg.hidden = true;
});
document.getElementById("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `하루결-백업-${TODAY}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  say("백업 파일을 만들었어요. '파일' 앱에 저장해두세요.");
});
document.getElementById("importFile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => {
    const d = JSON.parse(t);
    if (!d || !Array.isArray(d.events) || !Array.isArray(d.todos) || !Array.isArray(d.logs)) throw new Error();
    state = d; state.sample = false; save(); render(); say("백업을 불러왔어요.");
  }).catch(() => say("하루결 백업 파일이 아니에요. 다른 파일을 골라주세요."));
  e.target.value = "";
});

render();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
